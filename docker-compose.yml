version: "3.9"
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    environment:
      - CACHE_BACKEND=redis      # future‑proof; not used yet
    ports: ["8000:8000"]
    depends_on: [redis]

  nginx:
    image: nginx:stable-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["80:80"]
    depends_on: [backend]
